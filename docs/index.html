<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>DCL スタンプラリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Jost:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<style>
  /* ===== BEGINNER theme (default / purple・light) ===== */
  :root{
    --font-body:"Zen Kaku Gothic New", ui-sans-serif, system-ui, "Hiragino Kaku Gothic ProN", sans-serif;
    --font-disp:"Bricolage Grotesque","Zen Kaku Gothic New",sans-serif;
    --font-num:"DM Mono",monospace;
    --wrap:680px;

    --surface:#FFFFFF; --surface-2:#F5F6FC;
    --ink:#15172B; --ink-soft:#5B6084; --ink-faint:#9498B8;
    --line:#E2E5F1; --line-strong:#CBD0E4;

    --accent:#7C4DFF; --accent2:#FF3D77;
    --result:#C67A00; --task:#6A3FE0;
    --pts-grad:linear-gradient(100deg,#1FC7B6,#7C4DFF 55%,#FF3D77);
    --medal-glow2:#FF3D77;

    --hero-bg:var(--surface); --hero-ink:var(--ink); --hero-sub:var(--ink-soft); --hero-line:var(--line);
    --ring-track:#E4E7F3; --ring-ink:var(--ink); --ring-sub:var(--ink-faint);
    --stamp-face:#FFFFFF; --medal-face:#FFFFFF; --medal-dash:var(--line-strong); --check-ink:#0a0d1c;
    --note-ink:#5B6084; --note-b:#15172B;
    --shadow:0 1px 2px rgba(20,22,43,.05), 0 12px 32px -12px rgba(20,22,43,.18);
    --shadow-lift:0 2px 4px rgba(20,22,43,.06), 0 22px 48px -16px rgba(20,22,43,.28);
    --logo-light:block; --logo-dark:none;
  }

  /* ===== RISE theme (dark / ranking) ===== */
  body.mode-rise{
    --font-body:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
    --font-disp:'Jost',sans-serif;
    --font-num:'Jost',sans-serif;
    --wrap:680px;

    --surface:#141418; --surface-2:#141418;
    --ink:#f1f1f4; --ink-soft:#9a9aa4; --ink-faint:#9a9aa4;
    --line:#26262d; --line-strong:#3a3a44;

    --accent:#ffa32e; --accent2:#ff2f7b;
    --brand-orange:#eb5000; --brand-yellow:#facd00; --brand-pink:#f177c4;
    --result:#ffa32e; --task:#ff5fa2;
    --pts-grad:linear-gradient(100deg,#facd00,#ffa32e 55%,#ff2f7b);
    --medal-glow2:#ff2f7b;

    --hero-bg:linear-gradient(135deg,#17171a 0%,#33333a 30%,#0c0c0e 62%,#1f1f24 100%);
    --hero-ink:#fff; --hero-sub:rgba(255,255,255,.82); --hero-line:rgba(255,255,255,.14);
    --ring-track:#2a2a31; --ring-ink:#fff; --ring-sub:rgba(255,255,255,.65);
    --stamp-face:#0e0e12; --medal-face:#0e0e12; --medal-dash:#3a3a44; --check-ink:#141418;
    --note-ink:#c9c9d1; --note-b:#fff;
    --shadow:0 6px 18px rgba(0,0,0,.35);
    --shadow-lift:0 12px 26px rgba(0,0,0,.5);
    --logo-light:none; --logo-dark:block;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
    font-family:var(--font-body);
    background:
      radial-gradient(120% 60% at 85% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
      radial-gradient(120% 55% at 0% 0%, color-mix(in srgb, var(--accent2) 12%, transparent), transparent 55%),
      #EFF1FA;}
  body.mode-rise{
    background:
      radial-gradient(1100px 420px at 10% -10%, #24242a 0%, rgba(36,36,42,0) 62%),
      radial-gradient(900px 380px at 100% 2%, #2a1a22 0%, rgba(42,26,34,0) 58%),
      #0b0b0d;}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:22px 18px 64px;transition:max-width .2s}

  /* brand */
  .brandbar{display:flex;justify-content:center;margin:8px 0 18px}
  .brandbar img{height:34px;width:auto}
  .brandbar .lg-light{display:var(--logo-light)}
  .brandbar .lg-dark{display:var(--logo-dark)}

  /* liver chip */
  .liver{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
  .avatar{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-family:var(--font-disp);font-weight:800;font-size:21px;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent)}
  .liver-meta{display:flex;flex-direction:column;gap:3px;min-width:0}
  .liver-meta .nm{font-weight:800;font-size:18px}
  .liver-meta .sub{font-family:var(--font-num);font-size:12px;color:var(--ink-faint)}
  .liver-badge{margin-left:auto;flex:none;font-size:11px;font-weight:800;letter-spacing:.04em;padding:6px 11px;border-radius:999px;white-space:nowrap;
    color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}

  /* tabs */
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface-2);border:1px solid var(--line);padding:6px;border-radius:16px;margin-bottom:20px}
  .tab{appearance:none;border:0;cursor:pointer;border-radius:11px;padding:11px 10px;background:transparent;color:var(--ink-soft);
    font-family:var(--font-body);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
  .tab .en{font-family:var(--font-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
  .tab[aria-selected="true"]{color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent2));box-shadow:var(--shadow)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* rally panels */
  .rally{display:none;animation:fade .32s ease both}
  .rally.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* hero */
  .hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 24px;margin-bottom:14px;
    background:var(--hero-bg);color:var(--hero-ink);border:1px solid var(--line);box-shadow:var(--shadow-lift);
    display:flex;align-items:center;gap:20px}
  body.mode-rise .hero{border-color:rgba(255,255,255,.10);box-shadow:0 16px 34px rgba(0,0,0,.55)}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(90% 130% at 100% 0%, color-mix(in srgb,var(--accent) 18%,transparent), transparent 60%)}
  body.mode-rise .hero::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
  .hero-txt{position:relative;z-index:1;min-width:0;flex:1}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-disp);font-weight:700;font-size:11px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .hero h1{margin:0;font-family:var(--font-disp);font-weight:800;font-size:clamp(24px,6vw,34px);line-height:1.06;letter-spacing:.01em;text-wrap:balance}
  .pts{margin-top:14px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .pts b{font-family:var(--font-disp);font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1;font-variant-numeric:tabular-nums;
    background:var(--pts-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pts span{font-family:var(--font-num);font-size:13px;color:var(--hero-sub);font-weight:600}

  .ring{position:relative;z-index:1;flex:none;width:110px;height:110px}
  .ring svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
  .ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
  .ring .lbl b{font-family:var(--font-disp);font-size:30px;font-weight:800;color:var(--ring-ink)}
  .ring .lbl b i{font-style:normal;color:var(--ring-sub);font-size:16px}
  .ring .lbl span{display:block;font-family:var(--font-disp);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ring-sub);margin-top:5px;font-weight:700}

  /* ranking link (right under hero) */
  .ranklink{display:flex;align-items:center;gap:12px;margin:0 2px 18px;padding:14px 16px;border-radius:14px;text-decoration:none;
    background:color-mix(in srgb,var(--accent) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
    box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease}
  .ranklink:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
  .ranklink .em{font-size:20px;flex:none;line-height:1}
  .ranklink .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .ranklink .body .main{font-weight:800;font-size:14.5px;color:var(--ink)}
  .ranklink .body .sub{font-size:11px;color:var(--note-ink);line-height:1.35}
  .ranklink .body .sub b{color:var(--accent);font-weight:700}
  .ranklink .arw{flex:none;color:var(--accent);font-size:22px;line-height:1;font-weight:700}

  /* section header */
  .section-h{display:flex;align-items:center;gap:11px;margin:22px 2px 12px;--accent:var(--result)}
  .section-h.s-task{--accent:var(--task)}
  .section-h .axis{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:.02em;white-space:nowrap}
  .section-h .axis::before{content:"";width:11px;height:11px;border-radius:3px;background:var(--accent)}
  body.mode-rise .section-h .axis{padding-left:10px}
  body.mode-rise .section-h .axis::before{width:0;height:16px;border-radius:0;border-left:4px solid var(--accent);margin-right:-2px}
  .section-h .en{font-family:var(--font-disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .section-h .rule{flex:1;height:1px;background:var(--line);min-width:10px}
  .section-h .sub{font-family:var(--font-num);font-size:11.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
  .section-h .sub b{color:var(--accent)}

  /* task bundle */
  .bundle{--accent:var(--task);display:flex;align-items:center;gap:13px;margin-bottom:14px;padding:13px 15px;border-radius:16px;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
  .bundle .ic{font-size:22px;flex:none;line-height:1}
  .bundle .body{flex:1;min-width:0}
  .bundle .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .bundle .top b{font-size:13px;font-weight:800;color:var(--ink)}
  .bundle .top b em{font-style:normal;color:var(--accent)}
  .bundle .top span{font-family:var(--font-num);font-size:11.5px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
  .bundle .track{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .bundle .track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
  body.mode-rise .bundle .track i{background:linear-gradient(90deg,var(--task),var(--brand-pink))}
  .bundle.done{border-color:color-mix(in srgb,var(--task) 48%,var(--line))}
  .tasknote{display:flex;align-items:flex-start;gap:8px;margin:-4px 4px 14px;font-size:11.5px;color:var(--ink-soft);line-height:1.5}
  .tasknote .em{flex:none;font-size:13px;line-height:1.4}
  .tasknote b{color:var(--task);font-weight:800}

  /* stamp grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .stamp{position:relative;border-radius:16px;padding:34px 14px 14px;background:var(--surface);border:1px solid var(--line);
    box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;min-height:198px;justify-content:flex-start;
    transition:transform .16s ease, box-shadow .16s ease}
  .stamp:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
  .stamp.s-result{--accent:var(--result)} .stamp.s-task{--accent:var(--task)}
  .kind{position:absolute;top:12px;left:13px;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--accent);font-family:var(--font-disp)}
  .pt{position:absolute;top:10px;right:11px;font-family:var(--font-num);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;
    color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);font-variant-numeric:tabular-nums}
  .medal{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:30px;position:relative;margin-top:4px;
    background:var(--medal-face);border:2px dashed var(--medal-dash);color:var(--ink)}
  .stamp.done .medal{border:2px solid transparent;
    background:linear-gradient(var(--medal-face),var(--medal-face)) padding-box,
      conic-gradient(from 140deg, var(--accent), var(--medal-glow2), var(--accent)) border-box;
    box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 15%,transparent), 0 8px 22px -8px color-mix(in srgb,var(--accent) 62%,transparent)}
  .medal .check{position:absolute;right:-3px;bottom:-3px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--check-ink);
    display:grid;place-items:center;font-size:14px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid var(--medal-face)}
  .stamp .ttl{font-weight:800;font-size:13.5px;line-height:1.3;color:var(--ink);text-wrap:balance}
  .stamp .thr{font-family:var(--font-num);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .stamp .state{margin-top:auto;font-family:var(--font-num);font-size:10.5px;letter-spacing:.02em;padding-top:4px}
  .stamp.done .state{color:var(--accent);font-weight:600}
  .stamp.locked{opacity:.68}
  .stamp.locked .medal .emo{opacity:.5}
  .stamp.locked .state{color:var(--ink-faint)}
  .mini{width:100%;height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:2px}
  .mini i{display:block;height:100%;border-radius:99px;background:var(--accent)}
  body.mode-rise .stamp.s-result .mini i{background:linear-gradient(90deg,var(--brand-orange),var(--brand-yellow))}
  body.mode-rise .stamp.s-task .mini i{background:linear-gradient(90deg,var(--task),var(--brand-pink))}

  footer{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:34px;font-family:var(--font-num);line-height:1.7}
  footer .u{display:inline-flex;align-items:center;gap:6px}
  footer .u::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  footer .upd{color:var(--ink-faint);margin-left:10px;padding-left:10px;border-left:1px solid var(--line)}
  footer .upd:empty{display:none}

  @media (max-width:680px){ .grid{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:520px){
    .wrap{padding:20px 14px 56px}
    .hero{padding:18px 16px;gap:14px}
    .hero h1{font-size:22px}
    .pts b{font-size:32px}
    .ring{width:88px;height:88px}
    .ring .lbl b{font-size:25px}
    .tab{flex-direction:column;gap:2px;padding:9px 6px;font-size:13px;line-height:1.2}
    .tab .en{font-size:9.5px;letter-spacing:.1em}
    .section-h .en{display:none}
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .stamp{min-height:0;padding:30px 10px 13px}
    .medal{width:62px;height:62px;font-size:25px}
  }
  @media (max-width:340px){ .grid{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
  #app{min-height:46vh}
  .msg{text-align:center;padding:70px 20px;color:var(--ink-soft);font-size:14px;line-height:1.8}
  .msg b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px;font-weight:800}
  .statusbar{display:flex;align-items:center;gap:9px;margin:0 2px 16px;padding:12px 15px;border-radius:13px;font-size:12.5px;font-weight:700;line-height:1.45;
    background:color-mix(in srgb,var(--ink-faint) 13%,var(--surface));border:1px solid var(--line);color:var(--ink-soft)}
  .statusbar .em{font-size:16px;flex:none}
  .tabs.single{grid-template-columns:1fr}
  .tab-mark{font-family:var(--font-num);font-size:9px;font-weight:800;letter-spacing:.03em;line-height:1;padding:3px 7px;border-radius:999px;white-space:nowrap}
  /* 対象＝目立たせる（塗り＋タブ自体も強調） */
  .tab.is-target .tab-mark{background:var(--accent);color:#fff;border:1px solid transparent}
  .tab.is-target[aria-selected="true"] .tab-mark{background:rgba(255,255,255,.95);color:var(--accent)}
  .tab.is-target:not([aria-selected="true"]){background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--ink)}
  /* クリア＝控えめの枠 */
  .tab.is-cleared .tab-mark{border:1px solid currentColor;opacity:.8}
  .tab.is-cleared:not([aria-selected="true"]){opacity:.8}
  /* 参考＝しっかり後退させて対象を引き立てる */
  .tab.is-ref .tab-mark{opacity:.6;font-weight:700}
  .tab.is-ref:not([aria-selected="true"]){opacity:.42}
  .tasknote.locked b{color:var(--ink-soft)}
  .rally.locked .bundle,.rally.locked .grid.tasks{opacity:.72}

  /* ===== 達成スタンプの強調＋モーション ===== */
  .stamp.done{border-color:color-mix(in srgb,var(--accent) 34%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
  /* ビギナー限定：円リングをページのブランドグラデ(teal→purple→pink)に */
  body:not(.mode-rise) .stamp.done .medal{
    background:linear-gradient(var(--medal-face),var(--medal-face)) padding-box,
      conic-gradient(from 140deg, #1FC7B6, #7C4DFF, #FF3D77, #1FC7B6) border-box;
  }
  @media (prefers-reduced-motion:no-preference){
    .rally.on .stamp.done{animation:stampIn .55s cubic-bezier(.2,1.25,.4,1) backwards;animation-delay:calc(var(--i,0)*75ms + .06s)}
    .rally.on .stamp.done .check{animation:checkPop .45s cubic-bezier(.2,1.7,.4,1) backwards;animation-delay:calc(var(--i,0)*75ms + .33s)}
    .rally.on .stamp.done .medal{animation:glowPulse 3s ease-in-out infinite;animation-delay:calc(var(--i,0)*75ms + .7s)}
    body:not(.mode-rise) .rally.on .stamp.done .medal{animation-name:glowPulseBrand}
  }
  @keyframes stampIn{0%{opacity:0;transform:scale(.55) rotate(-7deg)}55%{opacity:1;transform:scale(1.06) rotate(1.5deg)}100%{opacity:1;transform:none}}
  @keyframes checkPop{0%{transform:scale(0)}65%{transform:scale(1.35)}100%{transform:scale(1)}}
  /* ビギナー：円リングのグローをブランド色(purple↔pink)で呼吸（RISEと同じ動き） */
  @keyframes glowPulseBrand{
    0%,100%{box-shadow:0 0 0 4px rgba(124,77,255,.14), 0 8px 22px -8px rgba(124,77,255,.42)}
    50%{box-shadow:0 0 0 6px rgba(255,61,119,.32), 0 0 18px -3px rgba(124,77,255,.42), 0 12px 28px -6px rgba(255,61,119,.5)}
  }
  /* RISE：元のアクセント(オレンジ)グロー（弱め） */
  @keyframes glowPulse{
    0%,100%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 14%,transparent), 0 8px 22px -8px color-mix(in srgb,var(--accent) 58%,transparent)}
    50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent), 0 11px 26px -6px color-mix(in srgb,var(--accent) 76%,transparent)}
  }
</style>
</head><body>

<script>
const RANK_URL = {
  beginner: "https://dcl-events.github.io/rankings/tiktok-202608-newcomer.html",
  rise:     "https://dcl-events.github.io/rankings/tiktok-202608-rise.html",
};
const META = {
  beginner: {en:"Beginner", jp:"ビギナー", title:"ビギナースタンプラリー", badge:"🚀 ビギナー", rankEm:"🌱", rankName:"ビギナーランキング"},
  rise:     {en:"Rise",     jp:"RISE",     title:"RISEスタンプラリー",   badge:"⚡ RISE",   rankEm:"⚡", rankName:"RISEランキング"},
};
const fmt = n => Number(n).toLocaleString("ja-JP");
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function resultCard(r, i){
  const pt = `<span class="pt">${fmt(r.pt)}pt</span>`;
  if (r.done){
    return `<div class="stamp s-result done" style="--i:${i||0}"><span class="kind">成果</span>${pt}
      <div class="medal"><span class="emo">${r.icon}</span><span class="check">✓</span></div>
      <div class="ttl">${esc(r.label)}</div><div class="thr">${fmt(r.target)}${r.unit} 達成</div><div class="state">達成</div></div>`;
  }
  const w = Math.max(3, Math.min(100, r.value/r.target*100));
  const remain = r.target - r.value;
  return `<div class="stamp s-result locked"><span class="kind">成果</span>${pt}
    <div class="medal"><span class="emo">${r.icon}</span></div>
    <div class="ttl">${esc(r.label)}</div><div class="thr">${fmt(r.value)} / ${fmt(r.target)}${r.unit}</div>
    <div class="mini"><i style="width:${w}%"></i></div>
    <div class="state">あと ${fmt(Math.round(remain*10)/10)}${r.unit}</div></div>`;
}

function taskCard(it, locked, i){
  if (it.done){
    return `<div class="stamp s-task done" style="--i:${i||0}"><span class="kind">課題</span>
      <div class="medal"><span class="emo">${it.icon}</span><span class="check">✓</span></div>
      <div class="ttl">${esc(it.label)}</div><div class="thr"></div><div class="state">${esc(it.done_on)||"達成"}</div></div>`;
  }
  return `<div class="stamp s-task locked"><span class="kind">課題</span>
    <div class="medal"><span class="emo">${it.icon}</span></div>
    <div class="ttl">${esc(it.label)}</div><div class="thr"></div><div class="state">${locked?"締め切り":"未達成"}</div></div>`;
}

function panel(tier, b, status){
  const m = META[tier];
  const locked = !!b.locked;
  const rEarn = b.results.filter(r=>r.done).reduce((s,r)=>s+r.pt,0);
  const rMax  = b.results.reduce((s,r)=>s+r.pt,0);
  const off = Math.round(289*(1 - b.pct/100));
  const t = b.tasks;
  const bundle = t.all_done
    ? `<div class="bundle done"><span class="ic">🎉</span><div class="body">
         <div class="top"><b>課題オールクリア <em>+${fmt(t.bundle_pt)}pt 獲得！</em></b><span>${t.done_count} / ${t.total} 達成</span></div>
         <div class="track"><i style="width:100%"></i></div></div></div>`
    : `<div class="bundle"><span class="ic">🎯</span><div class="body">
         <div class="top"><b>課題を全部そろえて <em>+${fmt(t.bundle_pt)}pt</em></b><span>${t.done_count} / ${t.total} 達成 ・ あと${t.total-t.done_count}つ</span></div>
         <div class="track"><i style="width:${Math.round(t.done_count/t.total*100)}%"></i></div></div></div>`;
  const rMem = b.result_member !== false;
  const tMem = b.task_member !== false;
  const fullRef = !rMem && !tMem;
  const note = !tMem
    ? `<div class="tasknote"><span class="em">👀</span><div>この課題は <b>${m.jp}ラリー対象者向け</b> です（参考表示・反映されません）。</div></div>`
    : (locked
      ? `<div class="tasknote locked"><span class="em">🔒</span><div>このラリーは<b>締め切り</b>ました（${esc(status)}）。獲得ポイントは確定しています。</div></div>`
      : `<div class="tasknote"><span class="em">📢</span><div>課題は自己申告制です。達成したら <b>DCL公式LINE</b> までご連絡ください。</div></div>`);
  const statusbar = fullRef
    ? `<div class="statusbar"><span class="em">👀</span><div><b>参考表示</b>：現在このラリーの対象ではありません（項目の確認用・ポイントは加算されません）</div></div>`
    : (rMem && !tMem
      ? `<div class="statusbar"><span class="em">✅</span><div><b>${m.jp}クリア済み</b>（成果は反映されます／課題は${m.jp}対象者向け）</div></div>`
      : (locked
        ? `<div class="statusbar"><span class="em">🎓</span><div>ステータス：<b>${esc(status)}</b>／ 課題は締め切り。獲得ポイントは確定しています。</div></div>` : ""));
  const rankSub = tMem ? `獲得ポイントは<b>このランキングに合算</b>されます` : `ランキングをチェックしてみましょう`;

  return `<section class="rally${locked?" locked":""}" id="rally-${tier}" role="tabpanel" style="display:none">
    <div class="hero">
      <div class="hero-txt">
        <span class="eyebrow">${m.en} · 成果 &amp; 課題</span>
        <h1>${m.title}</h1>
        <div class="pts"><b>${fmt(b.earned_pt)}</b><span>/ ${fmt(b.max_pt)} pt 獲得</span></div>
      </div>
      <div class="ring" aria-label="達成率 ${b.pct}%">
        <svg width="110" height="110" viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="46" fill="none" stroke="var(--ring-track)" stroke-width="9"/>
          <circle cx="52" cy="52" r="46" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="${off}"/>
        </svg>
        <span class="lbl"><b>${b.pct}<i>%</i></b><span>Clear</span></span>
      </div>
    </div>
    ${statusbar}
    <a class="ranklink" href="${RANK_URL[tier]}" target="_blank" rel="noopener">
      <span class="em">${m.rankEm}</span>
      <span class="body"><span class="main">${m.rankName}を見る</span><span class="sub">${rankSub}</span></span>
      <span class="arw">›</span></a>
    <div class="section-h"><span class="axis">成果</span><span class="en">Results</span><span class="rule"></span><span class="sub"><b>${fmt(rEarn)}</b> / ${fmt(rMax)}pt</span></div>
    <div class="grid">${b.results.map((r,i)=>resultCard(r,i)).join("")}</div>
    <div class="section-h s-task"><span class="axis">課題</span><span class="en">Tasks</span><span class="rule"></span><span class="sub">全部達成で <b>+${fmt(t.bundle_pt)}pt</b></span></div>
    ${bundle}
    ${note}
    <div class="grid tasks">${t.items.map((it,i)=>taskCard(it, locked, i)).join("")}</div>
  </section>`;
}

function render(d){
  const tiers = d.tiers || [];
  if (!tiers.length){ document.getElementById("app").innerHTML = `<div class="msg"><b>対象ラリーがありません</b>このアカウントは現在スタンプラリーの対象ではありません。</div>`; return; }
  const initial = (d.name||"?").trim().charAt(0) || "?";
  const mem_r = tiers.includes("rise");
  const mem_b = tiers.includes("beginner");
  const primary = mem_r ? "rise" : "beginner";   // ビギナーをクリア→RISEへ。現在の対象はRISE優先
  const badgeTxt = (d.status && d.status!=="在籍") ? ("🎓 " + d.status)
    : mem_r ? "⚡ RISE対象" : "🚀 ビギナー対象";
  const chip = `<div class="liver">
      <div class="avatar">${esc(initial)}</div>
      <div class="liver-meta"><span class="nm">${esc(d.name)}</span><span class="sub">@${esc(d.username)}</span></div>
      <span class="liver-badge" id="tierBadge">${esc(badgeTxt)}</span>
    </div>`;
  const ALL = ["beginner", "rise"];
  const markOf = t => t==="rise"
    ? (mem_r ? ["対象","is-target"] : ["参考","is-ref"])
    : (mem_r ? ["クリア","is-cleared"] : (mem_b ? ["対象","is-target"] : ["参考","is-ref"]));
  const tabs = `<div class="tabs" role="tablist">` + ALL.map(t=>{
      const [mk,cls]=markOf(t);
      return `<button class="tab ${cls}" id="tab-${t}" role="tab" aria-selected="${t===primary}" onclick="selectTier('${t}')"><span class="en">${META[t].en}</span> ${META[t].jp} <span class="tab-mark">${mk}</span></button>`;
    }).join("") + `</div>`;
  const panels = ALL.map(t => d[t] ? panel(t, d[t], d.status) : emptyPanel(t)).join("");
  document.getElementById("app").innerHTML = chip + tabs + panels;
  const lu = document.getElementById("lastUpdated");
  if (lu && d.updated_at) lu.textContent = "最終更新 " + d.updated_at;
  window._data = d;
  selectTier(primary);
}

function emptyPanel(tier){
  const m = META[tier];
  return `<section class="rally" id="rally-${tier}" role="tabpanel" style="display:none">
    <div class="hero"><div class="hero-txt"><span class="eyebrow">${m.en}</span><h1>${m.title}</h1>
      <div class="pts"><span>現在このラリーの対象ではありません</span></div></div></div>
    <a class="ranklink" href="${RANK_URL[tier]}" target="_blank" rel="noopener">
      <span class="em">${m.rankEm}</span>
      <span class="body"><span class="main">${m.rankName}を見る</span><span class="sub">ランキングをチェックしてみましょう</span></span>
      <span class="arw">›</span></a>
    <div class="msg">このアカウントは現在 <b>${m.jp}</b> ラリーの対象ではありません。</div>
  </section>`;
}

function selectTier(tier){
  const d = window._data;
  ["beginner", "rise"].forEach(t=>{
    const on = t===tier;
    const p = document.getElementById("rally-"+t); if (p){ p.style.display = on?"block":"none"; p.classList.toggle("on", on); }
    const tb = document.getElementById("tab-"+t); if (tb) tb.setAttribute("aria-selected", on);
  });
  document.body.classList.toggle("mode-rise", tier==="rise");
  window.scrollTo({top:0, behavior:"smooth"});
}

(function(){
  const id = new URLSearchParams(location.search).get("id");
  if (!id){ document.getElementById("app").innerHTML = `<div class="msg"><b>URLが正しくありません</b>個別URL（?id=…）からアクセスしてください。</div>`; return; }
  fetch("data/"+encodeURIComponent(id)+".json", {cache:"no-store"})
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(render)
    .catch(()=>{ document.getElementById("app").innerHTML = `<div class="msg"><b>ページが見つかりません</b>URLをご確認ください。不明な場合は DCL公式LINE までご連絡ください。</div>`; });
})();
</script>
</body></html>
